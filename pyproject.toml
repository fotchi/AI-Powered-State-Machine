[project]
name = "ai-powered-state-machine"
version = "0.1.0"
description = "AI-powered state machine for FLYNC"
authors = [
    {name = "nour jaballah"}
]
requires-python = ">=3.13,<3.14"
dependencies = ["langchain-core (>=1.5.3,<2.0.0)", "langchain-ollama (>=1.1.0,<2.0.0)", "langchain-anthropic (>=1.5.6,<2.0.0)", "langchain-google-genai (>=4.3.3,<5.0.0)", "langgraph (>=0.2)", "pydantic-extra-types (>=2.11.1,<3.0.0)", "rich (>=15.0.0,<16.0.0)", "semver (>=3.0.4,<4.0.0)", "scikit-learn (>=1.4,<2.0)", "anthropic (>=0.34,<1.0)", "requests (>=2.31,<3.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
[tool.pytest.ini_options]
pythonpath = ["src"]